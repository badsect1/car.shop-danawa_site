name: Auto Publish Car News to car.shop-danawa.co.kr

on:
  schedule:
    # 한국 시간(KST, UTC+9) 기준 하루 2회 자동 발행:
    # 1회차: 오전 09:00 (UTC 00:00) -> 1개 포스팅
    # 2회차: 오후 18:00 (UTC 09:00) -> 1개 포스팅
    # 하루 총 2개 신규 포스트 발행
    - cron: '0 0,9 * * *'
  workflow_dispatch: # GitHub 웹(Actions)에서 수동으로 즉시 1개 포스팅 실행 가능

jobs:
  publish-car-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 저장소 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🐍 Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔑 구글 서비스 계정 키 파일 생성 (선택 사항)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
          fi

      - name: 🚗 자동차 뉴스 수집 & 워드프레스(car.shop-danawa.co.kr) 자동 발행 (이미지 없음)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || '145.79.25.99' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          SSH_USER: ${{ secrets.SSH_USER || 'u687833262' }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          REMOTE_WP_PATH: ${{ secrets.REMOTE_WP_PATH || 'domains/shop-danawa.co.kr/public_html/car' }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://car.shop-danawa.co.kr' }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
        run: |
          python main.py --post-count 1

      - name: 💾 발행 히스토리 Git 저장소에 자동 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add published_history.json results_backup.csv || true
          git commit -m "Auto: published car news post $(date +'%Y-%m-%d %H:%M')" || exit 0
          git pull --rebase origin main || true
          git push origin main || true
